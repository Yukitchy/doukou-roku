<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2a2420;--mute:#7d7168;--ash:#8f857c;--line:#e8ddd0;--acc:#c2410c;--shadow:#9a3412;--onacc:#f9dccb;--mark:#ffeaa7;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;font-size:17px;line-height:1.85;-webkit-font-smoothing:antialiased;font-feature-settings:"palt"}
.wrap{max-width:880px;margin:0 auto;padding:0 28px}
h1,h2,h3,h4,.band b,.q blockquote{margin:0;line-height:1.2;text-wrap:balance;word-break:normal;word-break:auto-phrase;line-break:strict;overflow-wrap:anywhere}
p,li,dd,dt{word-break:normal;line-break:strict;overflow-wrap:anywhere}
p{max-width:38em}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:28px 0}
.brand{font-weight:900;font-size:15px;letter-spacing:.02em}
.pill{font-size:13px;font-weight:700;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:5px 14px;background:var(--card);white-space:nowrap;font-variant-numeric:tabular-nums}
.hero{padding:44px 0 56px}
.eyebrow{font-size:14px;font-weight:700;color:var(--acc);letter-spacing:.08em;margin-bottom:18px}
h1{font-size:clamp(34px,6vw,64px);font-weight:900;letter-spacing:-.03em}
.hero .lead{max-width:34em;font-size:19px;color:var(--mute);margin:24px 0 0}
nav.jump{display:flex;flex-wrap:wrap;gap:10px;margin-top:32px}
nav.jump a{display:block;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:12px 18px;text-decoration:none;color:var(--ink);font-weight:900;font-size:15px;box-shadow:0 3px 0 0 var(--line)}
nav.jump a:hover{transform:translateY(2px);box-shadow:0 1px 0 0 var(--line)}
nav.jump a small{display:block;font-weight:700;font-size:12px;color:var(--ash);letter-spacing:.04em;margin-top:2px;font-variant-numeric:tabular-nums}
.part{padding:72px 0 8px;border-top:2px solid var(--ink)}
.part>header{margin-bottom:40px}
.ptime{font-size:14px;font-weight:700;color:var(--acc);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.part h2{font-size:clamp(28px,4.4vw,44px);font-weight:900;letter-spacing:-.02em;margin:10px 0 0}
.part .blurb{font-size:18px;color:var(--mute);margin:16px 0 0;max-width:34em}
section.blk{padding:44px 0 0}
section.blk>h3{font-size:14px;font-weight:900;color:var(--ash);letter-spacing:.14em;margin-bottom:22px}
h4{font-size:19px;font-weight:900;margin:0 0 8px}
.summary{font-size:18px;line-height:1.9;margin:0 0 8px;max-width:36em}
.tracks{border-top:2px solid var(--ink);margin-top:8px}
.track{display:grid;grid-template-columns:190px 1fr;gap:20px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.tname{font-size:14px;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
.track audio{width:100%;height:34px}
.tl{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.tl li{padding:18px 0;border-bottom:1px solid var(--line);font-size:16px;line-height:1.75}
.band{background:var(--acc);color:#fff;padding:52px 48px;border-radius:24px;margin:8px 0 0}
.band h3{color:#fff;font-size:14px;letter-spacing:.14em;font-weight:900;margin-bottom:28px}
.band ol{list-style:none;margin:0;padding:0;display:grid;gap:24px}
.band li{display:grid;grid-template-columns:52px 1fr;gap:16px;align-items:start}
.band .num{font-size:46px;font-weight:900;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin-top:-2px}
.band b{display:block;font-size:19px;font-weight:900;line-height:1.5}
.band mark{background:rgba(255,255,255,.28);color:#fff;padding:0 .15em;border-radius:2px}
.open{border-top:2px solid var(--ink);margin-top:8px}
.open>div{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);font-size:16px}
.open span{color:var(--ash);font-weight:900}
.quotes{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:0 44px;border-top:2px solid var(--ink)}
.quotes li{padding:24px 0 26px;border-bottom:1px solid var(--line)}
.quotes blockquote{margin:0;font-size:19px;font-weight:700;line-height:1.6;letter-spacing:-.01em}
.quotes blockquote::before{content:"「"}.quotes blockquote::after{content:"」"}
.qm{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:12px;font-size:13px}
.qm .why{color:var(--mute)}
.ch{margin:0 0 48px}
.ch>h4{margin-bottom:6px}
.ch .chlead{border-left:3px solid var(--acc);padding-left:14px;margin:10px 0 22px;color:var(--mute);font-size:15px;line-height:1.8;max-width:36em}
.say{display:grid;grid-template-columns:104px 1fr;gap:16px;padding:10px 0;align-items:start}
.say .who{font-size:13px;font-weight:900;color:var(--ink);line-height:1.6;padding-top:3px}
.say .who .t{display:block;font-weight:700;color:var(--ash);font-variant-numeric:tabular-nums;margin-top:2px}
.say p{margin:0;font-size:16px;line-height:1.85}
mark{background:var(--mark);padding:0 .15em;border-radius:2px}
.ts{color:var(--acc);text-decoration:none;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line)}
.ts:hover{border-color:var(--acc)}
.prompt{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 26px;margin:0 0 18px}
.phead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.phead h4{flex:1;min-width:220px}
.copy{font:inherit;font-weight:900;font-size:13px;border:0;background:var(--acc);color:#fff;border-radius:8px;padding:9px 18px;cursor:pointer;box-shadow:0 3px 0 0 var(--shadow)}
.copy:active{transform:translateY(2px);box-shadow:0 1px 0 0 var(--shadow)}
.puse{width:100%;color:var(--mute);font-size:14px;margin:8px 0 0;line-height:1.75}
.prompt pre{white-space:pre-wrap;margin:16px 0 0;padding:18px 20px;background:var(--bg);border-radius:12px;font-family:inherit;font-size:15px;line-height:1.8}
.hw{border-top:2px solid var(--ink)}
.hw>div{display:grid;grid-template-columns:130px 1fr;gap:20px;padding:18px 0;border-bottom:1px solid var(--line)}
.hw b{font-size:15px;font-weight:900;color:var(--acc)}
.hw label{display:block;font-size:16px;line-height:1.75;cursor:pointer}
.hw input{margin-right:8px}
.hw .due{display:inline-block;font-size:12px;font-weight:700;color:var(--ash);letter-spacing:.04em;margin-left:8px;white-space:nowrap}
.hw :checked+span{color:var(--ash);text-decoration:line-through}
.links{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.links li{display:grid;grid-template-columns:minmax(200px,300px) 1fr;gap:20px;padding:16px 0;border-bottom:1px solid var(--line);font-size:15px}
.links b{font-weight:900}
.links a{color:var(--acc)}
.links .why{color:var(--mute);font-size:14px}
.none{color:var(--ash);font-size:15px}
.note{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px 28px;font-size:14px;color:var(--mute);line-height:1.85;margin-top:64px}
.note b{color:var(--ink);font-weight:900}
footer{padding:28px 0 56px;font-size:13px;color:var(--ash);border-top:1px solid var(--line);margin-top:28px}
nav.sticky{position:sticky;top:0;z-index:8;background:rgba(250,247,242,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -28px}
nav.sticky .swrap{max-width:880px;margin:0 auto;padding:10px 28px;display:flex;align-items:center;gap:18px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
nav.sticky .swrap::-webkit-scrollbar{display:none}
nav.sticky b{font-size:13px;font-weight:900;letter-spacing:.06em;color:var(--ash)}
nav.sticky a{font-size:14px;font-weight:900;color:var(--ink);text-decoration:none;border-bottom:2px solid transparent;padding-bottom:2px}
nav.sticky a:hover{border-color:var(--acc)}
nav.sticky .totop{margin-left:auto;font-weight:700;color:var(--ash);font-size:13px}
section.blk>h3{display:flex;align-items:center;gap:14px}
.openall{font:inherit;font-weight:900;font-size:12px;letter-spacing:.04em;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;padding:5px 14px;cursor:pointer}
.openall:hover{border-color:var(--acc);color:var(--acc)}
details.ch{border-bottom:1px solid var(--line);margin:0}
details.ch:first-of-type{border-top:2px solid var(--ink)}
details.ch>summary{list-style:none;cursor:pointer;padding:20px 0 20px 34px;position:relative}
details.ch>summary::-webkit-details-marker{display:none}
details.ch>summary::before{content:"";position:absolute;left:6px;top:31px;width:9px;height:9px;border-right:2px solid var(--acc);border-bottom:2px solid var(--acc);transform:rotate(-45deg);transition:transform .15s}
details.ch[open]>summary::before{transform:rotate(45deg);top:28px}
details.ch>summary .chlead{border:0;padding:0;margin:6px 0 0;font-size:15px}
details.ch .cnt{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:var(--ash);letter-spacing:.04em}
details.ch .lines{padding:4px 0 26px 34px}
details.fold{margin:28px 0 0;border-top:1px solid var(--line)}
details.fold>summary{list-style:none;cursor:pointer;padding:16px 0 16px 26px;position:relative;font-size:16px;font-weight:900}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"";position:absolute;left:4px;top:24px;width:8px;height:8px;border-right:2px solid var(--acc);border-bottom:2px solid var(--acc);transform:rotate(-45deg);transition:transform .15s}
details.fold[open]>summary::before{transform:rotate(45deg);top:21px}
details.fold .cnt{font-weight:700;font-size:13px;color:var(--ash);margin-left:8px}
details.fold .tl,details.fold .links{border-top:0;margin-top:-4px}
details.prompt{padding:0}
details.prompt>summary{list-style:none;cursor:pointer;padding:22px 26px}
details.prompt>summary::-webkit-details-marker{display:none}
details.prompt>summary .phead{margin:0}
details.prompt>summary h4::before{content:"＋ ";color:var(--acc)}
details.prompt[open]>summary h4::before{content:"− "}
details.prompt>pre{margin:0 26px 26px}
#mp{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--ink);padding:10px 20px;display:none;align-items:center;gap:16px;font-size:13px;z-index:9}
#mp.on{display:flex}#mp audio{flex:1;height:34px}
#mpname{color:var(--mute);font-weight:700;max-width:34%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mpclose{font:inherit;font-weight:900;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;cursor:pointer}
@media (max-width:640px){
 body{font-size:16px}.wrap{padding:0 20px}
 .hero{padding:32px 0 40px}.part{padding:52px 0 8px}section.blk{padding:36px 0 0}
 header.top{flex-direction:column;align-items:flex-start;gap:10px;padding:22px 0}
 .band{padding:36px 24px;border-radius:18px}.band li{grid-template-columns:40px 1fr;gap:12px}.band .num{font-size:36px}.band b{font-size:17px}
 .track{grid-template-columns:1fr;gap:4px;padding:14px 0}
 .say{grid-template-columns:1fr;gap:2px;padding:12px 0}.say .who .t{display:inline;margin-left:10px}
 .hw div,.links li{grid-template-columns:1fr;gap:6px}
 .prompt{padding:20px 18px;border-radius:16px}
 #mp{gap:10px;padding:8px 14px}#mpname{display:none}
 nav.sticky{margin:0 -20px}nav.sticky .swrap{padding:10px 20px;gap:14px}
 details.ch>summary{padding-left:28px}details.ch .lines{padding-left:0}
 details.prompt>summary{padding:18px}details.prompt>pre{margin:0 18px 18px}
}
</style></head><body><div class="wrap">
<nav class="sticky" id="sticky"><div class="swrap"><b>同行録</b>{{STICKY}}<a href="#top" class="totop">先頭</a></div></nav>
<header class="top" id="top"><div class="brand">{{BRAND}}</div><div class="pill">{{DATE}}</div></header>
<div class="hero">
 <div class="eyebrow">{{EYEBROW}}</div>
 <h1>{{H1}}</h1>
 <p class="lead">{{LEAD}}</p>
 <nav class="jump">{{NAV}}</nav>
</div>
{{BODY}}
<div class="note"><b>このページについて</b><br>{{NOTE}}</div>
<footer>{{BRAND}} — {{DATE}}</footer>
</div>
<div id="mp"><span id="mpname"></span><audio id="mpAudio" controls></audio><button id="mpclose">閉じる</button></div>
<script>
function copyText(t){
  try{if(navigator.clipboard&&isSecureContext){navigator.clipboard.writeText(t);return}}catch(e){}
  const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity=0;
  document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();
}
const mp=document.getElementById('mp'),ma=document.getElementById('mpAudio'),mn=document.getElementById('mpname');
document.addEventListener('click',e=>{
  const a=e.target.closest('a.ts');if(a){e.preventDefault();const f=a.dataset.file,s=+a.dataset.sec;
    document.querySelectorAll('audio').forEach(x=>x!==ma&&x.pause());
    if(ma.dataset.file!==f){ma.src='audio/'+encodeURIComponent(f);ma.dataset.file=f;mn.textContent=a.dataset.label||f.replace(/\.m4a$/,'');}
    mp.classList.add('on');
    const seek=()=>{try{ma.currentTime=s}catch(e){}};
    if(ma.readyState>0){seek()}else{ma.addEventListener('loadedmetadata',seek,{once:true});ma.load()}
    ma.play();return;}
  const b=e.target.closest('button.copy');if(b){e.preventDefault();e.stopPropagation();copyText(b.dataset.copy);b.textContent='コピーした';setTimeout(()=>b.textContent='コピー',1400);return;}
  if(e.target.id==='mpclose'){ma.pause();mp.classList.remove('on');}
});
document.querySelectorAll('.openall').forEach(btn=>btn.addEventListener('click',()=>{
  const ds=[...btn.closest('section').querySelectorAll('details')];
  const open=ds.some(d=>!d.open);
  ds.forEach(d=>d.open=open);
  btn.textContent=open?'すべて閉じる':'すべて開く';
}));
document.querySelectorAll('.hw input').forEach(c=>{try{c.checked=localStorage.getItem('todo:'+c.dataset.key)==='1'}catch(e){}
  c.addEventListener('change',()=>{try{localStorage.setItem('todo:'+c.dataset.key,c.checked?'1':'0')}catch(e){}})});
</script></body></html>
