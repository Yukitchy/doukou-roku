<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Akihabara Meeting Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#B8322A;
  --ink:#1F2426;
  --sub:#5F6B6E;
  --line:#DDD8CF;
  --bg:#FBF8F3;
  --band:#F1ECE3;
  --deco:rgba(255,255,255,.55);
  --ease-out:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Noto Sans TC","PingFang HK","PingFang TC",Meiryo,sans-serif;
  font-size:16px;line-height:1.85;-webkit-font-smoothing:antialiased}
html[lang=en] body{font-size:17px;line-height:1.65}
body,p,li,td,th,div,span,b,small,summary,button,a,h1,h2,h3,h4{word-break:auto-phrase;line-break:strict;overflow-wrap:anywhere}
h1,h2,h3,h4,.eyebrow{text-wrap:balance;line-height:1.35;letter-spacing:.01em}
p{text-wrap:pretty;max-width:68ch;margin:0 0 .8em}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:0 20px;position:relative;z-index:1}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:rgba(251,248,243,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px}
.brand{font-weight:700;font-size:14px;letter-spacing:.08em;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lang{display:flex;gap:2px;background:var(--band);border-radius:999px;padding:3px}
.lang{flex:none}
.lang button{white-space:nowrap;word-break:keep-all;overflow-wrap:normal;border:0;background:transparent;font:inherit;font-size:14px;font-weight:600;color:var(--sub);padding:5px 13px;border-radius:999px;cursor:pointer;transition:background .12s ease,color .12s ease}
.lang button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(60,40,20,.12)}

/* hero */
.hero{padding:56px 0 36px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;pointer-events:none;top:-60px;right:-80px;width:260px;height:260px;background:var(--deco);border-radius:0 0 0 100%}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.14em;color:var(--accent);margin:0 0 10px}
h1{font-size:clamp(28px,5vw,42px);margin:0 0 6px;font-weight:700}
.subtitle{font-size:clamp(17px,2.6vw,21px);color:var(--sub);margin:0 0 22px;font-weight:500}
.lead{font-size:17px;max-width:62ch}
.note{background:var(--band);padding:14px 18px;border-radius:12px;font-size:15px;color:var(--ink);max-width:62ch;margin:18px 0 0}

/* people */
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:26px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 0}
.person b{display:block;font-size:17px;margin-bottom:2px}
.person span{color:var(--sub);font-size:15px;line-height:1.6;display:block}

/* sections */
section{padding:44px 0 8px}
h2{font-size:clamp(22px,3.4vw,28px);margin:0 0 18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:36px}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{padding:10px 0 10px 22px;position:relative;border-top:1px solid var(--line)}
ul.plain li:last-child{border-bottom:1px solid var(--line)}
ul.plain li::before{content:"";position:absolute;left:4px;top:1.05em;width:8px;height:8px;border-radius:50%;background:var(--accent)}
ul.plain.hw li::before{border-radius:2px;transform:rotate(45deg)}
.who{font-weight:700;margin-right:.5em}

/* idea */
.idea{padding:30px 0 26px;border-top:2px solid var(--ink)}
.idea:first-of-type{border-top:0}
.tag{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.06em;padding:2px 10px;border-radius:999px;background:var(--band);color:var(--sub);margin-bottom:10px}
.tag[data-k="決定"],.tag[data-k="Decided"],.tag[data-k="已決定"]{background:var(--accent);color:#fff}
.idea h3{font-size:clamp(20px,3vw,25px);margin:0 0 10px}
.idea .what{font-size:17px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:18px}
.lbl{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--sub);margin:0 0 8px;text-transform:uppercase}
html[lang=ja] .lbl,html[lang=zh] .lbl{letter-spacing:.2em;text-transform:none}
.roles{margin:0;padding:0;list-style:none}
.roles li{display:grid;grid-template-columns:5.5em 1fr;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.roles li:last-child{border-bottom:1px solid var(--line)}
html[lang=en] .roles li{grid-template-columns:7em 1fr}
.roles b{font-weight:700}
.open{margin:0;padding-left:1.2em;font-size:15px}
.open li{margin:4px 0}
.next{background:var(--band);border-radius:12px;padding:12px 16px;margin-top:18px;font-size:15px}
.next b{color:var(--accent);margin-right:.6em}
.quotes{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
blockquote{margin:0;padding:12px 16px;border-left:3px solid var(--accent);background:#fff;border-radius:0 12px 12px 0;font-size:15px}
blockquote .q{margin:0 0 6px;font-style:italic}
blockquote .tr{margin:0 0 6px;color:var(--ink)}
blockquote cite{font-style:normal;color:var(--sub);font-size:13px}

/* misc lists */
.band{background:var(--band);border-radius:16px;padding:22px 24px}
.band h2{font-size:19px;margin-bottom:10px}
.band ul{margin:0;padding-left:1.2em;font-size:15px}
.band li{margin:4px 0}
.misc{display:grid;grid-template-columns:1fr 1fr;gap:20px}

footer{padding:40px 0 60px;color:var(--sub);font-size:14px}
footer a{font-weight:600}
.reveal{animation:reveal-in linear both;animation-timeline:view();animation-range:entry 5% cover 25%}
@keyframes reveal-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@supports not (animation-timeline:view()){.reveal{animation:none;opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:760px){
  .people,.two,.grid2,.quotes,.misc{grid-template-columns:1fr}
  .people{gap:14px}
  .hero{padding:36px 0 26px}
  .top .wrap{height:52px}
  .lang button{padding:5px 10px;font-size:13px}
  .brand{font-size:12px}
}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <div class="brand" id="brand"></div>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="ja" aria-pressed="false">日本語</button>
    <button data-lang="en" aria-pressed="false">English</button>
    <button data-lang="zh" aria-pressed="false">中文</button>
  </div>
</div></div>

<header class="hero"><div class="wrap">
  <p class="eyebrow" id="date"></p>
  <h1 id="title"></h1>
  <p class="subtitle" id="subtitle"></p>
  <p class="lead" id="lead"></p>
  <div class="note" id="source_note"></div>
  <div class="people" id="people"></div>
</div></header>

<main>
  <section class="reveal"><div class="wrap two">
    <div><h2 id="dec_t"></h2><ul class="plain" id="dec_l"></ul></div>
    <div><h2 id="hw_t"></h2><ul class="plain hw" id="hw_l"></ul></div>
  </div></section>

  <section><div class="wrap">
    <h2 id="ideas_t"></h2>
    <div id="ideas"></div>
  </div></section>

  <section class="reveal"><div class="wrap misc">
    <div class="band"><h2 id="ctx_t"></h2><ul id="ctx_l"></ul></div>
    <div class="band"><h2 id="chat_t"></h2><ul id="chat_l"></ul></div>
  </div></section>

  <section class="reveal"><div class="wrap">
    <div class="band"><h2 id="unc_t"></h2><ul id="unc_l"></ul></div>
  </div></section>
</main>

<footer><div class="wrap">
  <p><a id="tr_link" href="transcript.html"></a></p>
  <p id="foot"></p>
</div></footer>

<script>
const DATA = __DATA__;
const UI = {
  ja:{brand:"秋葉原ミーティング 2026.09.23", ideas:"いっしょにやれそうなこと", what:"何をやるか", roles:"誰が何を", next:"次の一手", open:"決まっていないこと", quotes:"録音から", foot:"録音2（31分59秒）をもとに作成。話者は内容から推定しているため、間違いがあれば教えてください。"},
  en:{brand:"Akihabara Meeting 2026.09.23", ideas:"Things we could do together", what:"What", roles:"Who does what", next:"Next step", open:"Still open", quotes:"From the recording", foot:"Based on recording 2 (31:59). Speakers were identified from context, so please flag any mistakes."},
  zh:{brand:"秋葉原會議 2026.09.23", ideas:"可以一起做的事", what:"做什麼", roles:"誰負責什麼", next:"下一步", open:"尚未決定", quotes:"錄音摘錄", foot:"根據錄音2（31分59秒）整理。發言者由內容推斷，如有錯誤請告知。"}
};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function li(items,cls){return items.map(x=>`<li>${typeof x==="string"?esc(x):`<span class="who">${esc(x.who)}</span>${esc(x.what)}`}</li>`).join("")}
function render(lang){
  const d=DATA[lang], u=UI[lang];
  document.documentElement.lang=lang;
  document.title=d.meta.title;
  $("brand").textContent=u.brand;
  $("date").textContent=d.meta.date; $("title").textContent=d.meta.title; $("subtitle").textContent=d.meta.subtitle;
  $("lead").textContent=d.meta.lead; $("source_note").textContent=d.meta.source_note;
  $("people").innerHTML=d.people.map(p=>`<div class="person"><b>${esc(p.name)}</b><span>${esc(p.role)}</span></div>`).join("");
  $("dec_t").textContent=d.decisions.title; $("dec_l").innerHTML=li(d.decisions.items);
  $("hw_t").textContent=d.homework.title; $("hw_l").innerHTML=li(d.homework.items);
  $("ideas_t").textContent=u.ideas;
  $("ideas").innerHTML=d.ideas.map(i=>`<article class="idea reveal" id="${i.id}">
    <span class="tag" data-k="${esc(i.tag)}">${esc(i.tag)}</span>
    <h3>${esc(i.title)}</h3>
    <p class="what">${esc(i.what)}</p>
    <div class="grid2">
      <div><p class="lbl">${u.roles}</p><ul class="roles">${i.roles.map(r=>`<li><b>${esc(r.who)}</b><span>${esc(r.does)}</span></li>`).join("")}</ul></div>
      <div><p class="lbl">${u.open}</p><ul class="open">${i.open.map(o=>`<li>${esc(o)}</li>`).join("")}</ul></div>
    </div>
    <div class="next"><b>${u.next}</b>${esc(i.next)}</div>
    <div class="quotes">${i.quotes.map(q=>`<blockquote><p class="q">“${esc(q.text)}”</p>${q.ja?`<p class="tr">${esc(q.ja)}</p>`:""}<cite>${esc(q.who)} · ${esc(q.t)}</cite></blockquote>`).join("")}</div>
  </article>`).join("");
  $("ctx_t").textContent=d.context.title; $("ctx_l").innerHTML=li(d.context.items);
  $("chat_t").textContent=d.chat.title; $("chat_l").innerHTML=li(d.chat.items);
  $("unc_t").textContent=d.unclear.title; $("unc_l").innerHTML=li(d.unclear.items);
  $("tr_link").textContent=d.transcript_link; $("foot").textContent=u.foot;
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  try{localStorage.setItem("lang",lang)}catch(e){}
  history.replaceState(null,"","?lang="+lang+location.hash);
}
function pick(){
  const q=new URLSearchParams(location.search).get("lang"); if(DATA[q])return q;
  try{const s=localStorage.getItem("lang"); if(DATA[s])return s}catch(e){}
  const n=(navigator.language||"en").toLowerCase();
  return n.startsWith("ja")?"ja":n.startsWith("zh")?"zh":"en";
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>render(b.dataset.lang)));
render(pick());
</script>
</body>
</html>
